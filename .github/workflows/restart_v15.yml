name: Restart Binance Pump Scanner V15

on:
  workflow_run:
    workflows:
      - "Binance Pump Scanner V15 Live"
    types:
      - completed
    branches:
      - main

permissions:
  actions: write

jobs:
  restart:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Start next V15 scan immediately
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/andygh18-sudo/binancepump/actions/workflows/binance_pump_v15.yml/dispatches \
            -f ref=main