name: Restart Binance Pump Scanner V15

on:
  workflow_run:
    workflows:
      - "Binance Pump Scanner V15 Live"
    types:
      - completed
    branches:
      - main

permissions:
  actions: write

concurrency:
  group: restart-binance-pump-v15
  cancel-in-progress: false

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for an active V15 scan
        id: active_scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          active_runs="$(gh api             --method GET             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "/repos/andygh18-sudo/binancepump/actions/workflows/binance_pump_v15.yml/runs?branch=main&per_page=10"             --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')"

          echo "Active V15 runs: $active_runs"

          if [ "$active_runs" -gt 0 ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start next V15 scan immediately
        if: steps.active_scan.outputs.active == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             /repos/andygh18-sudo/binancepump/actions/workflows/binance_pump_v15.yml/dispatches             -f ref=main

      - name: Skip duplicate restart
        if: steps.active_scan.outputs.active == 'true'
        run: echo "A V15 scan is already queued or running; no duplicate dispatch was created."
