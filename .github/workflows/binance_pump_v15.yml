name: Binance Pump Scanner V15 Live

on:
  schedule:
    # Run every 15 minutes, offset from the top of the hour to reduce GitHub scheduling congestion.
    - cron: "7,22,37,52 * * * *"
  push:
    paths:
      - "scanner/worker.py"
      - "scanner/history_store.py"
      - "scripts/compact_v15_2_history.py"
      - "run_scanner.py"
      - "app.py"
      - ".github/workflows/binance_pump_v15.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: write

# V15.1 five-minute trajectory retry trigger
concurrency:
  group: binance-pump-v15-live
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare data
        run: mkdir -p data

      - name: Validate V15 production scanner
        run: python -m py_compile scanner/worker.py scanner/history_store.py scripts/compact_v15_2_history.py scanner/tradingview.py run_scanner.py app.py

      - name: Run V15 live scan
        env:
          BINANCE_WS_BASE: wss://data-stream.binance.vision/stream
          BINANCE_REST_BASE: https://data-api.binance.vision
          MAX_SYMBOLS: "120"
          MIN_QUOTE_VOLUME: "100000"
          DISCOVERY_MIN_QUOTE_VOLUME: "50000"
          LIQUID_SYMBOLS: "80"
          MOMENTUM_SYMBOLS: "40"
          RUN_SECONDS: "540"
          DECISION_INTERVAL: "5"
          IGNITION_HISTORY_SAMPLES: "60"
          HISTORY_SAMPLE_INTERVAL: "300"
          ALERT_COOLDOWN: "60"
          ORDERBOOK_LIMIT: "500"
          TOP_ALERTS: "5"
          ACCUM_ALERT_SCORE: "60"
          V8_ALERT_SCORE: "58"
          V9_ALERT_SCORE: "58"
          V9_MIN_PERSISTENCE: "2"
          V10_ALERT_SCORE: "60"
          V10_MIN_PERSISTENCE: "2"
          V11_ALERT_SCORE: "65"
          V11_CONFIRMED_SCORE: "72"
          V11_MIN_PERSISTENCE: "2"
          V12_ALERT_SCORE: "62"
          V12_CONFIRMED_SCORE: "70"
          V12_MIN_PERSISTENCE: "2"
          EXHAUSTION_ALERT_SCORE: "72"
          EXHAUSTION_MIN_EXTENSION: "2.5"
          EXHAUSTION_COOLDOWN: "120"
          TRADINGVIEW_ENABLED: "1"
          TRADINGVIEW_REFRESH_SECONDS: "30"
          TRADINGVIEW_TIMEOUT: "8"
          V8_MIN_PERSISTENCE: "2"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          rm -rf /tmp/v15-live-publisher
          git worktree add --detach /tmp/v15-live-publisher HEAD

          publish_live_snapshot() {
            if [ ! -f "$GITHUB_WORKSPACE/data/latest.json" ]; then
              return 0
            fi
            cp "$GITHUB_WORKSPACE/data/latest.json" /tmp/v15-live-publisher/data/latest.json
            cd /tmp/v15-live-publisher
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin main
            git reset --hard origin/main
            git add -f data/latest.json
            if git diff --cached --quiet; then
              cd "$GITHUB_WORKSPACE"
              return 0
            fi
            git commit -m "Publish V15 live snapshot"
            git push origin HEAD:main
            cd "$GITHUB_WORKSPACE"
          }

          python run_scanner.py &
          V15_PID=$!
          export V15_PID

          (
            while kill -0 "$V15_PID" 2>/dev/null; do
              sleep 30
              publish_live_snapshot || true
            done
          ) &
          PUBLISHER_PID=$!

          wait $V15_PID
          wait $PUBLISHER_PID || true

          # Publish the final snapshot here as well; the existing publish step
          # remains responsible for the complete history files.
          publish_live_snapshot || true
          git worktree remove --force /tmp/v15-live-publisher

      - name: Migrate and compact V15.2 symbol history
        run: |
          python scripts/compact_v15_2_history.py

      - name: Compact V15.1 ignition history
        run: python scripts/compact_ignition_history.py

      - name: Publish V15.2 scan data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          cp data/latest.json /tmp/v15-latest.json
          if [ -f data/ignition_history.jsonl ]; then cp data/ignition_history.jsonl /tmp/v15-ignition-history.jsonl; else : > /tmp/v15-ignition-history.jsonl; fi
          cp data/history_index.json /tmp/v15-history-index.json
          rm -rf /tmp/v15-history
          cp -R data/history /tmp/v15-history

          # Reset to current remote main before restoring only generated data.
          # The legacy monolithic history file is deliberately removed.
          git reset --hard origin/main
          mkdir -p data
          rm -f data/history.jsonl
          rm -rf data/history
          cp /tmp/v15-latest.json data/latest.json
          cp /tmp/v15-ignition-history.jsonl data/ignition_history.jsonl
          cp /tmp/v15-history-index.json data/history_index.json
          cp -R /tmp/v15-history data/history

          git add -f data/latest.json data/ignition_history.jsonl data/history_index.json
          git add -A data/history
          if git diff --cached --quiet; then
            echo "V15.2 scan data already synchronized."
            exit 0
          fi
          git commit -m "Update V15.2 historical scanner data"
          git push origin HEAD:main

      - name: Start next V15 scan after successful run
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run binance_pump_v15.yml --ref main
