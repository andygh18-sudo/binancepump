name: Binance Pump Scanner V15.6 Live

on:
  schedule:
    - cron: "2,32 * * * *"
  push:
    paths:
      - "scanner/worker.py"
      - "scanner/history_store.py"
      - "scanner/v154.py"
      - "scanner/v156_outcomes.py"
      - "scripts/backfill_v156_outcomes.py"
      - "scripts/compact_v15_2_history.py"
      - "run_scanner.py"
      - "app.py"
      - ".github/workflows/binance_pump_v15.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: write

concurrency:
  group: binance-pump-v15-live
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare data
        run: |
          mkdir -p data
          cp /tmp/v157-fastest-pump-leaderboard.json data/v157_fastest_pump_leaderboard.json
          touch data/v154_events.jsonl
      - name: Validate V15 production scanner
        run: python -m py_compile scanner/worker.py scanner/v154.py scanner/v156_outcomes.py scanner/history_store.py scripts/backfill_v156_outcomes.py scripts/compact_v15_2_history.py scanner/tradingview.py run_scanner.py app.py scripts/pump_learner_v156.py
      - name: Validate generated V15 worker
        run: python scripts/validate_worker_bootstrap.py
      - name: Run V15.6 live scan
        env:
          BINANCE_WS_BASE: wss://data-stream.binance.vision/stream
          BINANCE_REST_BASE: https://data-api.binance.vision
          MAX_SYMBOLS: "120"
          MIN_QUOTE_VOLUME: "100000"
          DISCOVERY_MIN_QUOTE_VOLUME: "50000"
          LIQUID_SYMBOLS: "80"
          MOMENTUM_SYMBOLS: "40"
          RUN_SECONDS: "540"
          DECISION_INTERVAL: "5"
          IGNITION_HISTORY_SAMPLES: "60"
          HISTORY_SAMPLE_INTERVAL: "300"
          ALERT_COOLDOWN: "60"
          ORDERBOOK_LIMIT: "500"
          TOP_ALERTS: "5"
          ACCUM_ALERT_SCORE: "60"
          V8_ALERT_SCORE: "58"
          V9_ALERT_SCORE: "58"
          V9_MIN_PERSISTENCE: "2"
          V10_ALERT_SCORE: "60"
          V10_MIN_PERSISTENCE: "2"
          V11_ALERT_SCORE: "65"
          V11_CONFIRMED_SCORE: "72"
          V11_MIN_PERSISTENCE: "2"
          V12_ALERT_SCORE: "62"
          V12_CONFIRMED_SCORE: "70"
          V12_MIN_PERSISTENCE: "2"
          EXHAUSTION_ALERT_SCORE: "72"
          EXHAUSTION_MIN_EXTENSION: "2.5"
          EXHAUSTION_COOLDOWN: "120"
          TRADINGVIEW_ENABLED: "1"
          TRADINGVIEW_REFRESH_SECONDS: "30"
          TRADINGVIEW_TIMEOUT: "8"
          V8_MIN_PERSISTENCE: "2"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          V153_ALERTS_ENABLED: "0"
          V156_ADAPTIVE_CAPTURE_ENABLED: "1"
          V156_SIGNATURES_ENABLED: "1"
          V156_FAST_SCORE_MIN: "85"
          V156_FAST_COOLDOWN: "180"
          V156_SIGNATURE_COOLDOWN: "240"
          V156_LEARNER_TARGET_PCT: "3.0"
          V156_LEARNER_HORIZON_SECONDS: "600"
        run: |
          set -e
          rm -rf /tmp/v15-live-publisher
          git worktree add --detach /tmp/v15-live-publisher HEAD
          publish_live_snapshot() {
            if [ ! -f "$GITHUB_WORKSPACE/data/latest.json" ]; then return 0; fi
            cp "$GITHUB_WORKSPACE/data/latest.json" /tmp/v15-live-publisher/data/latest.json
            if [ -f "$GITHUB_WORKSPACE/data/v157_fastest_pump_leaderboard.json" ]; then cp "$GITHUB_WORKSPACE/data/v157_fastest_pump_leaderboard.json" /tmp/v15-live-publisher/data/v157_fastest_pump_leaderboard.json; fi
            cd /tmp/v15-live-publisher
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin main
            git reset --hard origin/main
            git add -f data/latest.json data/v157_fastest_pump_leaderboard.json
            if git diff --cached --quiet; then cd "$GITHUB_WORKSPACE"; return 0; fi
            git commit -m "Publish V15.6 live snapshot"
            git push origin HEAD:main
            cd "$GITHUB_WORKSPACE"
          }
          python run_scanner.py &
          V15_PID=$!
          export V15_PID
          (
            while kill -0 "$V15_PID" 2>/dev/null; do
              sleep 30
              publish_live_snapshot || true
            done
          ) &
          PUBLISHER_PID=$!
          wait $V15_PID
          wait $PUBLISHER_PID || true
          publish_live_snapshot || true
          git worktree remove --force /tmp/v15-live-publisher
      - name: Run V15.6 pump learner
        run: python scripts/pump_learner_v156.py
      - name: Backfill V15.6 outcomes from Binance 1m klines
        env:
          BINANCE_REST_BASE: https://data-api.binance.vision
          V156_BACKFILL_MAX_SYMBOLS: "150"
          V156_BACKFILL_ONLY_UNRESOLVED: "1"
          V156_BACKFILL_SLEEP: "0.12"
        run: python scripts/backfill_v156_outcomes.py
      - name: Migrate and compact V15.2 symbol history
        run: python scripts/compact_v15_2_history.py
      - name: Compact V15.1 ignition history
        run: python scripts/compact_ignition_history.py
      - name: Start next V15.6 cycle
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          echo "Dispatching next V15.6 monitoring cycle..."
          gh workflow run .github/workflows/binance_pump_v15.yml --ref main
          echo "Next V15.6 cycle dispatched."

      - name: Publish V15.6 scan data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          cp data/latest.json /tmp/v15-latest.json
          if [ -f data/v157_fastest_pump_leaderboard.json ]; then cp data/v157_fastest_pump_leaderboard.json /tmp/v157-fastest-pump-leaderboard.json; else printf '{"updated":0,"symbols":{},"top":[]}\n' > /tmp/v157-fastest-pump-leaderboard.json; fi
          if [ -f data/ignition_history.jsonl ]; then cp data/ignition_history.jsonl /tmp/v15-ignition-history.jsonl; else : > /tmp/v15-ignition-history.jsonl; fi
          cp data/history_index.json /tmp/v15-history-index.json
          rm -rf /tmp/v15-history
          cp -R data/history /tmp/v15-history
          rm -rf /tmp/v15-microstructure
          if [ -d data/microstructure ]; then cp -R data/microstructure /tmp/v15-microstructure; fi
          if [ -f data/v154_events.jsonl ]; then cp data/v154_events.jsonl /tmp/v15-v154-events.jsonl; else : > /tmp/v15-v154-events.jsonl; fi
          if [ -f data/adaptive_microstructure_history.jsonl ]; then cp data/adaptive_microstructure_history.jsonl /tmp/v15-adaptive-history.jsonl; else : > /tmp/v15-adaptive-history.jsonl; fi
          if [ -f data/v156_signature_learning.json ]; then cp data/v156_signature_learning.json /tmp/v15-v156-learning.json; else printf "{}\n" > /tmp/v15-v156-learning.json; fi
          if [ -f data/v156_outcomes.jsonl ]; then cp data/v156_outcomes.jsonl /tmp/v15-v156-outcomes.jsonl; else : > /tmp/v15-v156-outcomes.jsonl; fi
          if [ -f data/v156_outcome_summary.json ]; then cp data/v156_outcome_summary.json /tmp/v15-v156-outcome-summary.json; else printf "{}\n" > /tmp/v15-v156-outcome-summary.json; fi
          git reset --hard origin/main
          mkdir -p data
          rm -f data/history.jsonl
          rm -rf data/history
          cp /tmp/v15-latest.json data/latest.json
          cp /tmp/v15-ignition-history.jsonl data/ignition_history.jsonl
          cp /tmp/v15-history-index.json data/history_index.json
          cp -R /tmp/v15-history data/history
          rm -rf data/microstructure
          if [ -d /tmp/v15-microstructure ]; then cp -R /tmp/v15-microstructure data/microstructure; fi
          cp /tmp/v15-v154-events.jsonl data/v154_events.jsonl
          cp /tmp/v15-adaptive-history.jsonl data/adaptive_microstructure_history.jsonl
          cp /tmp/v15-v156-learning.json data/v156_signature_learning.json
          cp /tmp/v15-v156-outcomes.jsonl data/v156_outcomes.jsonl
          cp /tmp/v15-v156-outcome-summary.json data/v156_outcome_summary.json
          git add -f data/latest.json data/v157_fastest_pump_leaderboard.json data/ignition_history.jsonl data/history_index.json data/v154_events.jsonl data/adaptive_microstructure_history.jsonl data/v156_signature_learning.json data/v156_outcomes.jsonl data/v156_outcome_summary.json
          git add -A data/history data/microstructure
          if git diff --cached --quiet; then
            echo "V15.2/V15.4 scan data already synchronized."
            exit 0
          fi
          git commit -m "Update V15.6 historical scanner data"
          git push origin HEAD:main
