name: Binance Pump Scanner V15.7 Live

on:
  schedule:
    - cron: "2,32 * * * *"
  push:
    paths:
      - "scanner/worker.py"
      - "scanner/v157_learning.py"
      - "scanner/orderbook.py"
      - "scanner/tradingview.py"
      - "scanner/v156.py"
      - "run_scanner.py"
      - "app.py"
      - ".github/workflows/binance_pump_v15.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: binance-pump-v15-live
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare V15.7 learning data
        run: |
          set -e
          mkdir -p data
          touch data/v157_observations.jsonl

      - name: Validate V15.7 scanner
        run: |
          set -e
          python -m py_compile scanner/worker.py scanner/v157_learning.py scanner/orderbook.py scanner/tradingview.py scanner/v156.py run_scanner.py app.py

      - name: Validate worker bootstrap
        run: python scripts/validate_worker_bootstrap.py

      - name: Run V15.7 live scan
        env:
          BINANCE_WS_BASE: wss://data-stream.binance.vision/stream
          BINANCE_REST_BASE: https://data-api.binance.vision
          MAX_SYMBOLS: "120"
          MIN_QUOTE_VOLUME: "100000"
          DISCOVERY_MIN_QUOTE_VOLUME: "50000"
          LIQUID_SYMBOLS: "80"
          MOMENTUM_SYMBOLS: "40"
          RUN_SECONDS: "540"
          DECISION_INTERVAL: "5"
          IGNITION_HISTORY_SAMPLES: "60"
          HISTORY_SAMPLE_INTERVAL: "300"
          ALERT_COOLDOWN: "60"
          ORDERBOOK_LIMIT: "500"
          TOP_ALERTS: "5"
          ACCUM_ALERT_SCORE: "60"
          V8_ALERT_SCORE: "58"
          V9_ALERT_SCORE: "58"
          V9_MIN_PERSISTENCE: "2"
          V10_ALERT_SCORE: "60"
          V10_MIN_PERSISTENCE: "2"
          V11_ALERT_SCORE: "65"
          V11_CONFIRMED_SCORE: "72"
          V11_MIN_PERSISTENCE: "2"
          V12_ALERT_SCORE: "62"
          V12_CONFIRMED_SCORE: "70"
          V12_MIN_PERSISTENCE: "2"
          EXHAUSTION_ALERT_SCORE: "72"
          EXHAUSTION_MIN_EXTENSION: "2.5"
          EXHAUSTION_COOLDOWN: "120"
          TRADINGVIEW_ENABLED: "1"
          TRADINGVIEW_REFRESH_SECONDS: "30"
          TRADINGVIEW_TIMEOUT: "8"
          V8_MIN_PERSISTENCE: "2"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          V153_ALERTS_ENABLED: "0"
          V156_ADAPTIVE_CAPTURE_ENABLED: "1"
          V156_SIGNATURES_ENABLED: "1"
          V156_FAST_SCORE_MIN: "85"
          V156_FAST_COOLDOWN: "180"
          V156_SIGNATURE_COOLDOWN: "240"
          V156_LEARNER_TARGET_PCT: "3.0"
          V156_LEARNER_HORIZON_SECONDS: "600"
        run: |
          set -e
          python run_scanner.py

      - name: Publish V15.7 learning data
        if: ${{ success() }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          cp data/v157_observations.jsonl /tmp/v157_observations.jsonl 2>/dev/null || : > /tmp/v157_observations.jsonl
          cp data/latest.json /tmp/latest.json 2>/dev/null || true
          cp data/v157_fastest_pump_leaderboard.json /tmp/v157_fastest_pump_leaderboard.json 2>/dev/null || true
          git reset --hard origin/main
          mkdir -p data
          cp /tmp/v157_observations.jsonl data/v157_observations.jsonl
          if [ -f /tmp/latest.json ]; then cp /tmp/latest.json data/latest.json; fi
          if [ -f /tmp/v157_fastest_pump_leaderboard.json ]; then cp /tmp/v157_fastest_pump_leaderboard.json data/v157_fastest_pump_leaderboard.json; fi
          git add -f data/v157_observations.jsonl data/latest.json data/v157_fastest_pump_leaderboard.json
          if git diff --cached --quiet; then
            echo "No new V15.7 data to publish."
            exit 0
          fi
          git commit -m "Publish V15.7 live learning data"
          git push origin HEAD:main

      - name: Start next V15.7 cycle
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          echo "Dispatching next V15.7 monitoring cycle..."
          gh workflow run .github/workflows/binance_pump_v15.yml --ref main
          echo "Next V15.7 cycle dispatched."
