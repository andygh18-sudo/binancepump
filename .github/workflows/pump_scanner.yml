name: Binance Pump Scanner v7.6

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare data directory
        run: mkdir -p data

      - name: Run live scan
        env:
          BINANCE_WS_BASE: wss://data-stream.binance.vision/stream
          BINANCE_REST_BASE: https://data-api.binance.vision
          MAX_SYMBOLS: "40"
          MIN_QUOTE_VOLUME: "1000000"
          RUN_SECONDS: "250"
          DECISION_INTERVAL: "5"
          ALERT_COOLDOWN: "60"
          ORDERBOOK_LIMIT: "1000"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_scanner.py

      - name: Publish scan data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.jsonl
          git diff --cached --quiet || git commit -m "Update scanner data"
          git push
