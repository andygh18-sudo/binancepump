name: Pump Replay Backtest v14

on:
  push:
    paths:
      - "backtest/pump_replay_v14.py"
      - ".github/workflows/pump_replay_v14.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pandas requests
      - name: Validate V14 syntax
        run: python -m py_compile backtest/pump_replay_v14.py
      - name: Run V14 replay
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python backtest/pump_replay_v14.py --symbols "BNBUSDT,LINKUSDT,DOGEUSDT,XRPUSDT,ADAUSDT,LTCUSDT,ATOMUSDT,NEARUSDT,APTUSDT,FILUSDT" --train-start "2026-09-13T00:00:00Z" --start "2026-09-20T00:00:00Z" --end "2026-09-25T00:00:00Z" --output "data/backtest_results_v14.json"
      - name: Publish V14 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/v14_results
          cp data/backtest_results_v14.json /tmp/v14_results/backtest_results_v14.json
          cp data/v14_calibration.json /tmp/v14_results/v14_calibration.json

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --mixed origin/main
            cp /tmp/v14_results/backtest_results_v14.json data/backtest_results_v14.json
            cp /tmp/v14_results/v14_calibration.json data/v14_calibration.json
            git add -f data/backtest_results_v14.json data/v14_calibration.json

            if git diff --cached --quiet; then
              echo "V14 result files already match repository; nothing to commit."
              exit 0
            fi

            git commit -m "Update V14 expansion backtest results"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Publish attempt $attempt failed due to concurrent main update; retrying."
            sleep 3
          done

          exit 1