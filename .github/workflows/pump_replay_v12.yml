name: Pump Replay Backtest v12

on:
  push:
    paths:
      - "backtest/pump_replay_v12.py"
      - ".github/workflows/pump_replay_v12.yml"
  workflow_dispatch:
    inputs:
      symbols:
        required: false
        default: "BNBUSDT,LINKUSDT,DOGEUSDT,XRPUSDT,ADAUSDT,LTCUSDT,ATOMUSDT,NEARUSDT,APTUSDT,FILUSDT"
      train_start:
        required: false
        default: "2026-09-13T00:00:00Z"
      start:
        required: false
        default: "2026-09-20T00:00:00Z"
      end:
        required: false
        default: "2026-09-25T00:00:00Z"

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pandas requests
      - name: Validate V12 syntax
        run: python -m py_compile backtest/pump_replay_v12.py

      - name: Run V12 replay
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python backtest/pump_replay_v12.py \
            --symbols "${{ inputs.symbols || 'BNBUSDT,LINKUSDT,DOGEUSDT,XRPUSDT,ADAUSDT,LTCUSDT,ATOMUSDT,NEARUSDT,APTUSDT,FILUSDT' }}" \
            --train-start "${{ inputs.train_start || '2026-09-13T00:00:00Z' }}" \
            --start "${{ inputs.start || '2026-09-20T00:00:00Z' }}" \
            --end "${{ inputs.end || '2026-09-25T00:00:00Z' }}"
      - name: Publish results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B publish-v12 origin/main
          cp data/backtest_results_v12.json /tmp/backtest_results_v12.json
          cp data/v12_calibration.json /tmp/v12_calibration.json
          git checkout "$GITHUB_SHA" -- backtest/pump_replay_v12.py .github/workflows/pump_replay_v12.yml
          cp /tmp/backtest_results_v12.json data/backtest_results_v12.json
          cp /tmp/v12_calibration.json data/v12_calibration.json
          git add data/backtest_results_v12.json data/v12_calibration.json
          if git diff --cached --quiet; then
            echo "No V12 result changes."
            exit 0
          fi
          git commit -m "Update V12 replay results"
          git push origin publish-v12:main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest_results_v12.json data/v12_calibration.json
          if git diff --cached --quiet; then
            echo "No V12 result changes."
            exit 0
          fi
          git commit -m "Update V12 replay results"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
